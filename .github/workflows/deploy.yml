name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # 只有仓库变量 CF_DEPLOY=true 时才部署，免得没配密钥时每次推送都失败
    if: >-
      vars.CF_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: 部署到 Cloudflare（blog、admin、api-proxy）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_API_URL: https://ling-api.crashvibe.cn
          VITE_SITE_URL: https://ling.crashvibe.cn
          VITE_BLOG_URL: https://ling.crashvibe.cn
          VITE_UMAMI_URL: ${{ vars.VITE_UMAMI_URL }}
          VITE_UMAMI_ID: ${{ vars.VITE_UMAMI_ID }}
        run: bun run deploy
